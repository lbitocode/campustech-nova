<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <rect width="640" height="400" fill="#fff7ed"/>
  <!-- Manzanas -->
  <g fill="#ede4ff">
    <rect x="20" y="20" width="150" height="110" rx="10"/>
    <rect x="210" y="20" width="170" height="110" rx="10"/>
    <rect x="420" y="20" width="200" height="110" rx="10"/>
    <rect x="20" y="170" width="150" height="90" rx="10"/>
    <rect x="420" y="170" width="200" height="90" rx="10"/>
    <rect x="20" y="300" width="150" height="90" rx="10"/>
    <rect x="210" y="300" width="170" height="90" rx="10"/>
    <rect x="420" y="300" width="200" height="90" rx="10"/>
  </g>
  <!-- Parque -->
  <rect x="210" y="170" width="170" height="90" rx="10" fill="#bef264"/>
  <g fill="#65a30d"><circle cx="250" cy="205" r="14"/><circle cx="290" cy="228" r="16"/><circle cx="340" cy="200" r="13"/></g>
  <!-- Avenidas -->
  <path d="M0 150 H640" stroke="#fde047" stroke-width="22"/>
  <path d="M400 0 V400" stroke="#fde047" stroke-width="22"/>
  <path d="M0 150 H640 M400 0 V400" stroke="#1b1340" stroke-width="2" stroke-dasharray="10 12" fill="none"/>
  <!-- Línea del Metropolitano -->
  <path d="M120 400 C150 300 160 200 190 150 S260 40 300 0" stroke="#e5173f" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="190" cy="150" r="12" fill="#fff" stroke="#e5173f" stroke-width="6"/>
  <text x="200" y="138" font-family="sans-serif" font-size="14" font-weight="700" fill="#1b1340">Est. España</text>
  <text x="560" y="144" font-family="sans-serif" font-size="13" font-weight="700" fill="#1b1340" text-anchor="end">Av. Petit Thouars</text>
</svg>
